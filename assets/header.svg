<svg width="100%" height="220" viewBox="0 0 1000 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d13"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#141922"/>
    </linearGradient>

    <!-- Accent Line Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363d" stop-opacity="0"/>
      <stop offset="30%" stop-color="#d29922" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f0f6fc" stop-opacity="1"/>
      <stop offset="70%" stop-color="#d29922" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#30363d" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle Tech Grid -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#21262d" stroke-width="0.6" stroke-opacity="0.4"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="220" rx="12" fill="url(#bg-grad)"/>
  <rect width="1000" height="220" rx="12" fill="url(#grid)"/>

  <!-- Border Frame -->
  <rect x="1" y="1" width="998" height="218" rx="11" fill="none" stroke="#30363d" stroke-width="1.2" stroke-opacity="0.7"/>

  <!-- Top System Badge -->
  <g transform="translate(500, 42)">
    <rect x="-140" y="-14" width="280" height="26" rx="13" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="-118" cy="-1" r="4.5" fill="#39d353" filter="url(#glow)"/>
    <text x="-105" y="4" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Fira Code', monospace" font-size="11" font-weight="600" letter-spacing="2.5">SYSTEMS // ONLINE</text>
  </g>

  <!-- Main Title -->
  <text x="500" y="118" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="5">
    PRASOON PATHAK
  </text>

  <!-- Center Decorative Glow Line -->
  <line x1="260" y1="140" x2="740" y2="140" stroke="url(#accent-grad)" stroke-width="2"/>
  <circle cx="500" cy="140" r="3" fill="#f0f6fc" filter="url(#glow)"/>

  <!-- Subtitle -->
  <text x="500" y="176" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Fira Code', monospace" font-size="14.5" font-weight="500" letter-spacing="2.8">
    SOFTWARE ENGINEER · APPLIED AI · DATA SYSTEMS
  </text>

  <!-- Tech Terminal Corner Accents -->
  <path d="M 16 32 L 16 16 L 32 16" fill="none" stroke="#d29922" stroke-width="2"/>
  <path d="M 984 32 L 984 16 L 968 16" fill="none" stroke="#d29922" stroke-width="2"/>
  <path d="M 16 188 L 16 204 L 32 204" fill="none" stroke="#30363d" stroke-width="2"/>
  <path d="M 984 188 L 984 204 L 968 204" fill="none" stroke="#30363d" stroke-width="2"/>
</svg>